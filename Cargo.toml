[workspace]
resolver = "2"
members = [
    "kleos-core",
    "kleos-rocks",
    "kleos-bin",
    "kleos-core-examples",
    "kleos-infer",
    "kleos-engram",
]
# kleos-infer (ML inference, UPGRADE_PLAN D2) and kleos-engram (Engram
# addressing; docs/specs/engram-overlay.md) are opt-in: a bare `cargo build`
# at the root keeps building only the database crates.
default-members = [
    "kleos-core",
    "kleos-rocks",
    "kleos-bin",
    "kleos-core-examples",
]
# Language bindings are built outside the workspace. kleos-lib-python is
# maintained and built on its own (maturin); the C, Java, Node.js, Swift and
# WASM bindings are unmaintained and kept in-tree for a later revival.
# kleos-core/fuzz is a separate cargo-fuzz workspace.
exclude = [
    "kleos-lib-c",
    "kleos-lib-java",
    "kleos-lib-wasm",
    "kleos-lib-swift",
    "kleos-lib-python",
    "kleos-lib-nodejs",
    "third_party/candle-metal-kernels",
]

[profile.bench]
lto = true
debug = true

[profile.dev.package."kleos-rocks"]
opt-level = 3

# kleos patch of candle's Metal kernels: pins the Metal Shading Language
# version so the kernels compile inside hosts linked against an old SDK (e.g.
# Python interpreters). See third_party/candle-metal-kernels/KLEOS_PATCH.md.
[patch.crates-io]
candle-metal-kernels = { path = "third_party/candle-metal-kernels" }
