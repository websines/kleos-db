[workspace]
resolver = "2"
members = [
    "kleos-core",
    "kleos-rocks",
    "kleos-bin",
    "kleos-core-examples",
    "kleos-infer",
]
# kleos-infer (ML inference, UPGRADE_PLAN D2) is opt-in: a bare `cargo build`
# at the root keeps building only the database crates.
default-members = [
    "kleos-core",
    "kleos-rocks",
    "kleos-bin",
    "kleos-core-examples",
]
# Language bindings are built outside the workspace. kleos-lib-python is
# maintained and built on its own (maturin); the C, Java, Node.js, Swift and
# WASM bindings are unmaintained and kept in-tree for a later revival.
# kleos-core/fuzz is a separate cargo-fuzz workspace.
exclude = [
    "kleos-lib-c",
    "kleos-lib-java",
    "kleos-lib-wasm",
    "kleos-lib-swift",
    "kleos-lib-python",
    "kleos-lib-nodejs",
]

[profile.bench]
lto = true
debug = true

[profile.dev.package."kleos-rocks"]
opt-level = 3
