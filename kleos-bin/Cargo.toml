[package]
name = "kleos-bin"
version = "0.7.6"
edition = "2021"
license = "MPL-2.0"
description = "kleos: standalone server, REPL, CLI and MCP server"
authors = ["Ziyang Hu"]
homepage = "https://github.com/websines/kleos-db"
repository = "https://github.com/websines/kleos-db"
documentation = "https://docs.cozodb.org"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The CLI, MCP server and their backend are a library the binary and the
# tests share (docs/specs/mcp-cli-skills.md).
[lib]
name = "kleos_bin"
path = "src/lib.rs"

[[bin]]
name = "kleos-bin"
path = "src/main.rs"

[features]
#! # Features

## Default build: the `compact` combo (sqlite backend + requests + graph-algo).
## Without a default the bare `cargo build -p kleos-bin` failed to resolve `rayon`
## (kleos-core uses rayon unconditionally on non-wasm, but it is only pulled in via
## the `graph-algo` feature) and produced a backend-less binary. `compact` gives a
## runnable sqlite-backed server/REPL out of the box; opt into rocksdb explicitly.
default = ["compact"]
## Enables the `minimal`, `requests` and `graph-algo` features
compact = ["minimal", "requests", "graph-algo"]
## Enables the `storage-sqlite` and `graph-algo` features
mobile = ["storage-sqlite", "graph-algo"]
## Enables the `minimal`, `requests` and `graph-algo` features in single threaded mode
compact-single-threaded = ["minimal", "requests", "graph-algo"]
## Enables the `storage-sqlite` feature
minimal = ["storage-sqlite"]
## Enables the [Sqlite](https://www.sqlite.org/index.html) backend, also allows backup and restore with Sqlite data files.
storage-sqlite = ["kleos/storage-sqlite"]
## Enables the [RocksDB](http://rocksdb.org/) backend
storage-rocksdb = ["kleos/storage-rocksdb"]
## Enables the graph algorithms
graph-algo = ["kleos/graph-algo"]
## Allows the utilities to make web requests to fetch data
requests = ["kleos/requests"]
## Uses jemalloc as the global allocator, can make a difference in performance
jemalloc = ["kleos/jemalloc"]
## Enables io-uring option for the RocksDB storage
io-uring = ["kleos/io-uring"]
## Built-in embedders for `--embedder` / `::embedder enable` (needs rustc >= 1.99)
infer = ["kleos/infer"]
## Documents in the memory API (`POST /memory/remember` with attachments, `POST /doc/:op`).
docs = ["kleos/docs"]
## `infer` plus Apple-GPU (Metal) kernels; macOS only
infer-metal = ["infer", "kleos/infer-metal"]
## Enables the [Sled](https://github.com/spacejam/sled) backend
storage-sled = ["kleos/storage-sled"]
## Enables the [TiKV](https://tikv.org/) client backend
storage-tikv = ["kleos/storage-tikv"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
kleos = { version = "0.18.0", path = "../kleos-core", default-features = false }
clap = { version = "4.5.4", features = ["derive"] }
env_logger = "0.11.3"
log = "0.4.21"
rand = "0.8.5"
serde_derive = "1.0.199"
serde = { version = "1.0.199" }
chrono = "0.4.38"
serde_json = "1.0.116"
sha2 = "0.10.8"
prettytable = "0.10.0"
rustyline = "14.0.0"
minreq = { version = "2.11.2", features = ["https-rustls"] }
miette = { version = "5.10.0", features = ["fancy"] }
ctrlc = "3.4.4"
axum = "0.7.5"
axum-macros = "0.4.1"
itertools = "0.12.1"
tokio = { version = "1.37.0", features = ["full"] }
async-stream = "0.3.5"
futures = "0.3.30"
crossbeam = "0.8.4"
eventsource-client = "0.12.2"
tower-http = { version = "0.5.2", features = ["full"] }
rayon = "1.10.0"
