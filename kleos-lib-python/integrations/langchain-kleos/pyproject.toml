[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-kleos"
version = "0.2.1"
description = "LangChain VectorStore for kleos — embedded graph + vector + full-text store with one-call hybrid retrieval."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MPL-2.0" }
authors = [{ name = "Shan Rizvi" }]
keywords = ["langchain", "kleos", "vectorstore", "hybrid-search", "rag", "cozodb"]
dependencies = [
    "kleos>=0.8.3",
    "langchain-core>=0.3,<2.0",
]

[project.urls]
Homepage = "https://github.com/websines/kleos-db"
Repository = "https://github.com/websines/kleos-db"

[tool.hatch.build.targets.wheel]
packages = ["langchain_kleos"]
