[package]
name = "kleos-node"
version = "0.18.0"
description = "Native Node.js binding for kleos (napi-rs); used by the `kleos` TypeScript SDK in sdk/ts"
authors = ["Ziyang Hu", "kleos contributors"]
license = "MPL-2.0"
homepage = "https://github.com/websines/kleos-db"
repository = "https://github.com/websines/kleos-db"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["compact"]
## SQLite storage, web requests and graph algorithms (the default build)
compact = ["kleos/compact"]
## RocksDB storage backend
storage-rocksdb = ["kleos/storage-rocksdb"]
## Built-in models (embedders, decider, GLiNER), CPU
infer = ["kleos/infer"]
## Built-in models with Metal and Accelerate (Apple silicon)
infer-metal = ["kleos/infer-metal"]
## Documents through remember (OCR, chunking)
docs = ["kleos/docs"]
## Engram overlays
engram = ["kleos/engram"]

[dependencies]
kleos = { version = "0.18.0", path = "../kleos-core", default-features = false }
miette = "5.10.0"
serde_json = "1.0.116"
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[patch.crates-io]
candle-metal-kernels = { path = "../third_party/candle-metal-kernels" }
