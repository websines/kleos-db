[package]
name = "kleos-infer"
version = "0.1.0"
edition = "2021"
description = "Single-forward-pass inference (embedders; later rerankers and decision heads) for kleos"
license = "MPL-2.0"
repository = "https://github.com/websines/kleos-db"
keywords = ["embeddings", "inference", "kleos"]
categories = ["science"]

[features]
default = ["download"]
## Fetch missing model files into the Hugging Face cache when a model is
## enabled (blocking ureq + rustls; no async runtime). `HF_HUB_OFFLINE=1`
## turns it off at run time.
download = ["dep:hf-hub"]
## Apple-GPU kernels through candle's Metal backend (macOS only).
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal", "dep:objc2"]
## Apple Accelerate (AMX) BLAS for CPU matmuls (macOS only).
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
safetensors = "0.6"
# anonymous-mmap staging for the token table at load (freed straight back to the OS)
memmap2 = "0.9"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Autorelease pool around Metal work (see gemma.rs `with_pool`); already in
# the tree through candle-metal-kernels.
objc2 = { version = "0.6", optional = true }
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"], optional = true }
