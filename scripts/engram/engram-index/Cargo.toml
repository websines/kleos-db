[package]
name = "engram-index"
version = "0.0.0"
edition = "2021"
publish = false
description = "Research prototype: DeepSeek Engram index computation (tokenizer compression + multi-head N-gram hashing), parity-checked against engram_demo_v1.py"
license = "MPL-2.0"

# Standalone: not a member of the kleos workspace.
[workspace]

[dependencies]
# Same pin and features as kleos-infer.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
serde_json = "1"

[profile.release]
debug = false
