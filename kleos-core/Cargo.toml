[package]
name = "kleos"
version = "0.18.0"
edition = "2021"
description = "A transactional relational-graph-vector database using Datalog — a maintained fork of CozoDB, tuned as a substrate for agentic memory"
authors = ["Shan Rizvi", "Ziyang Hu (original CozoDB author)"]
license = "MPL-2.0"
repository = "https://github.com/websines/kleos-db"
readme = "README-kleos.md"
keywords = ["database", "datalog", "graph", "vector", "embedded"]
categories = ["database", "database-implementations"]
# only the registered [[bench]] targets build (pokec/wiki_pagerank are
# nightly-bencher relics kept for reference)
autobenches = false
exclude = [
    "tests/*",
]

[features]
#! # Features

default = ["compact"]
## Enables the `minimal`, `requests` and `graph-algo` features.
compact = ["minimal", "requests", "graph-algo"]
## Enables the `minimal`, `requests` and `graph-algo` features in single threaded mode.
compact-single-threaded = ["minimal", "requests", "graph-algo"]
## Enables the `storage-sqlite` feature.
minimal = ["storage-sqlite", "storage-sqlite-src"]
## Enables the [Sqlite](https://www.sqlite.org/index.html) backend,
## also allows backup and restore with Sqlite data files.
## Sqlite is easy to compile, has very low resource requirements and reasonable performance,
## but does not support much concurrency.
storage-sqlite = ["dep:sqlite"]
storage-sqlite-src = ["dep:sqlite3-src", "sqlite3-src/bundled"]
## Enables the [RocksDB](http://rocksdb.org/) backend.
## RocksDB is hard to compile on some platforms, uses more resources than SQLite,
## but is very performant and supports an extremely high level of concurrency.
## You can also [fine-tune](https://github.com/cozodb/cozo/blob/main/TUNING_ROCKSDB.md) RocksDB options.
storage-rocksdb = ["dep:kleos-rocks"]
storage-new-rocksdb = ["dep:rocksdb"]
## Enables the graph algorithms.
graph-algo = ["graph", "rayon"]
## Registers CsvReader and JsonReader, which allow queries to read arbitrary
## process-readable files. With `requests`, they may also make outbound requests.
## Only enable this for trusted CozoScript callers.
data-import = []
## Allows data-import utilities to make web requests. This does not register
## CsvReader/JsonReader by itself; enable `data-import` as well, and only for
## trusted CozoScript callers.
requests = ["dep:minreq"]
## Lets durable-workflow `http` steps make outbound requests
## (docs/specs/durable-workflows.md). Off by default.
flow-http = ["requests"]
## Registers RdfReader (Turtle/N-Triples/N-Quads/TriG into a fixed 6-column
## relational shape) and enables `Db::export_relation_as_rdf`. Implies
## `data-import` — the reader is a script-controlled file reader and shares
## that single trust gate, so enabling this also registers CsvReader and
## JsonReader. With `requests`, non-`file://` URLs become fetchable. Only
## enable for trusted CozoScript callers. (kleos fork; see
## docs/specs/rdf-boundary-io.md.)
rdf-io = ["data-import", "dep:oxttl", "dep:oxrdf"]
## Host-controlled Parquet and Arrow IPC bulk import into existing stored
## relations (kleos fork; docs/specs/parquet-arrow.md). This does not register
## a CozoScript file reader and therefore does not imply `data-import`.
columnar-io = [
    "dep:arrow-array",
    "dep:arrow-data",
    "dep:arrow-schema",
    "dep:arrow-ipc",
    "dep:parquet",
]
## Uses jemalloc as the global allocator, can make a difference in performance.
jemalloc = ["dep:tikv-jemallocator-global", "kleos-rocks?/jemalloc"]
## Enables io-uring option for the RocksDB storage
io-uring = ["kleos-rocks?/io-uring"]
## Polyfills for the WASM target
wasm = ["uuid/js", "dep:js-sys"]
## Internal (kleos fork). Exposes a commit fence inside `commit_tx` so the
## graph-projection freshness protocol can be tested at its race windows from
## outside the crate. Never enable in production: it adds a lock acquisition to
## every writing commit and lets arbitrary code run mid-commit.
test-hooks = []

#! The following features are highly experimental:

## Enables the [Sled](https://github.com/spacejam/sled) backend.
## Sled is slower than Sqlite for the usual workload of Cozo, can use quite a lot of disk space,
## and may not be stable enough. In general you should use RocksDB instead.
## The Sled engine does not support time travel.
storage-sled = ["dep:sled"]
## Enables the [TiKV](https://tikv.org/) client backend.
## The only reason that you may want to use this is that your data does not fit in a single machine.
## This engine is orders of magnitude slower than every other engine for graph traversals, due to the
## significant network overhead. Simple point-lookup queries are fine, though.
## The TiKV engine does not support time travel.
storage-tikv = ["dep:tikv-client", "dep:tokio"]
## Read-only Cypher query surface (kleos fork): translate an openCypher subset
## to CozoScript. No extra dependencies (reuses the existing pest stack). Off by
## default during alpha; see docs/specs/cypher-read.md.
cypher = []
## Built-in embedders from the `kleos-infer` crate (UPGRADE_PLAN D2/D3):
## `kleos::embed::builtin` registers EmbeddingGemma / Model2Vec models read
## from the Hugging Face cache, downloading missing files when a model is
## enabled (`HF_HUB_OFFLINE=1` to forbid). Off by default: the default build has no
## ML dependencies, and models are never bundled. candle 0.11 needs a newer toolchain than 1.90 (verified on 1.99).
infer = ["dep:kleos-infer", "kleos-infer/download", "kleos-infer/gliner"]
## Engram overlay store (kleos fork; docs/specs/engram-overlay.md): per-user
## and per-agent row edits to a model's Engram tables, versioned with valid
## time, provenance per fact, export as safetensors. Pulls in `kleos-engram`
## (Engram addressing; `tokenizers`, no ML runtime). Off by default.
engram = ["dep:kleos-engram"]
## Documents in the memory API (docs/specs/documents.md): `remember` reads
## PDFs (text layer or OCR), images, Markdown, HTML and DOCX into chunk
## memories. Pulls in `kleos-docs` (tract, pdfium at run time); needs the
## 1.91+ toolchain like `infer`.
docs = ["dep:kleos-docs", "kleos-docs/download"]
## Documents by URL in `remember` attachments (http/https only, public
## addresses only, size-capped; docs/specs/documents.md). Off by default.
docs-url = ["docs", "requests"]
## `infer` plus Apple-GPU (Metal) kernels.
# Accelerate too: Metal builds are macOS-only, and the CPU path (device
# `cpu`, or anything Metal can't run) is 2-2.5x faster with Apple BLAS
infer-metal = ["infer", "kleos-infer/metal", "kleos-infer/accelerate"]
## `infer` plus Apple Accelerate BLAS for CPU matmuls (macOS; 3-5x faster
## decider-nano on CPU; no f16 on CPU).
infer-accelerate = ["infer", "kleos-infer/accelerate"]

#! # Recommendation for features to enable
#!
#! Generally you will want the `storage-sqlite` and `graph-algo` features enabled,
#! unless your environment makes compiling them difficult. The backup/restore functionalities
#! are only available if `storage-sqlite` is on. Without `graph-algo` you cannot use any graph algorithms
#! (utilities are still available),
#! which could be OK if you only want to deal with pure Datalog.
#!
#! `data-import` registers CsvReader and JsonReader, which can read arbitrary
#! process-readable files. Pair it with `requests` to allow outbound HTTP(S)
#! reads. Only enable `data-import` for trusted CozoScript callers.
#!
#! The `wasm` feature simply patches some functions so that they can compile on WASM platform,
#! which lacks some std implementations at the moment. (On WASM you must also enable `nothread`).
#! This feature will not work on any other platform.
#!
#! The `jemalloc` feature only makes sense for desktop and servers. It could improve performance,
#! sometimes substantially, but you need to benchmark for your use case. It also tends to break
#! builds on untested platforms. None of our prebuilt binaries have it enabled.
#!
#! Enable `storage-rocksdb` if you expect high concurrency or want better performance than SQLite,
#! but note that RocksDB is much more resource-hungry and takes long to compile.
#!
#! The other storage options are just for experimentation. We do not recommend using them.

[dependencies]
casey = "0.4.0"
either = "1.11.0"
rand = "0.8.5"
miette = { version = "5.10.0", features = ["fancy"] }
lazy_static = "1.4.0"
log = "0.4.21"
smallvec = { version = "1.13.2", features = ["serde", "write", "union", "const_generics", "const_new"] }
smartstring = { version = "1.0.1", features = ["serde"] }
serde_json = "1.0.116"
serde = { version = "1.0.199" }
serde_derive = "1.0.199"
serde_bytes = "0.11.14"
rmp = "0.8.14"
rmp-serde = "1.2.0"
rmpv = "1.0.2"
base64 = "0.22.0"
chrono = "0.4.38"
chrono-tz = "0.9.0"
priority-queue = "1.4.0"
ordered-float = "4.2.0"
byteorder = "1.5.0"
num-traits = "0.2.18"
itertools = "0.12.1"
regex = "1.10.4"
# Floor is load-bearing: the parser diagnostics call `pest::set_error_detail`,
# which pest 2.8.0 introduced when it made parse-attempt tracking opt-in. A
# lockfile resolving 2.7.x would fail to compile `parse/mod.rs`.
pest = "2.8"
pest_derive = "2.8"
approx = "0.5.1"
unicode-normalization = "0.1.23"
thiserror = "1.0.59"
uuid = { version = "1.8.0", features = ["v1", "v4", "v5", "serde"] }
csv = "1.3.0"
# RDF boundary I/O (kleos fork, docs/specs/rdf-boundary-io.md). oxttl is
# gated behind `rdf-io` (the default build gains zero bytes); oxiri is an
# UNCONDITIONAL dep by signed decision (spec §12 Q3): the IRI helper scalar
# functions are registered unconditionally like every builtin, and RFC 3987
# correctness is worth one small pure-Rust zero-transitive-dep crate. Neither
# crate's types are ever re-exported from the public API (public-dependency
# semver policy — see the `graph` re-export lesson in CLAUDE.md).
oxttl = { version = "0.2.3", optional = true }
# oxttl's parse results are oxrdf terms (Triple/Quad/Term enums), so consuming
# the parser output requires naming oxrdf types; oxttl 0.2.3 pins oxrdf =0.3.3
# and this requirement unifies with that pin. Same gate as oxttl.
oxrdf = { version = "0.3.3", optional = true }
oxiri = "0.3.1"
# Columnar boundary I/O (kleos fork, docs/specs/parquet-arrow.md). Keep the
# official arrow-rs family on one exact release so its internal public types
# cannot split across versions. These crates are fully gated by `columnar-io`;
# no Arrow type is re-exported from kleos's public API.
arrow-array = { version = "=59.2.0", default-features = false, optional = true }
arrow-data = { version = "=59.2.0", default-features = false, optional = true }
arrow-schema = { version = "=59.2.0", default-features = false, features = ["canonical_extension_types"], optional = true }
arrow-ipc = { version = "=59.2.0", default-features = false, features = ["lz4", "zstd"], optional = true }
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "arrow_canonical_extension_types", "snap", "zstd", "crc"], optional = true }
document-features = "0.2.8"
# Upper bound is load-bearing: rayon 1.11 breaks `graph_builder` 0.4.x
# (the `graph` crate's CSR builder, pulled by `graph-algo`) — its `edges()`
# par-iter stops compiling. Both crates are dormant upstream; relax the bound
# only after verifying a fresh resolve of graph-algo builds against it.
rayon = { version = ">=1.10.0, <1.11", optional = true }
minreq = { version = "2.11.2", features = ["https-rustls"], optional = true }
tikv-jemallocator-global = { version = "0.5.0", optional = true }
kleos-rocks = { path = "../kleos-rocks", version = "0.1.12", optional = true }
rocksdb = { version = "0.22.0", optional = true }
sled = { version = "0.34.7", optional = true }
tikv-client = { version = "0.3.0", optional = true }
tokio = { version = "1.37.0", optional = true }
sqlite = { version = "0.36.0", optional = true }
sqlite3-src = { version = "0.6.1", optional = true }
js-sys = { version = "0.3.60", optional = true }
graph = { version = "0.3.1", optional = true }
crossbeam = "0.8.4"
ndarray = { version = "0.15.6", features = ["serde"] }
half = "2.4.1"
sha2 = "0.10.8"
# Skill library (docs/specs/skills.md): SKILL.md frontmatter is YAML, and
# skill packages carry detached Ed25519 signatures in minisign format.
serde_yaml = "0.9.34"
ed25519-dalek = "2.1"
blake2 = "0.10"
kleos-infer = { path = "../kleos-infer", version = "0.1.0", optional = true, default-features = false }
kleos-engram = { path = "../kleos-engram", version = "0.1.0", optional = true }
kleos-docs = { path = "../kleos-docs", version = "0.1.0", optional = true, default-features = false, features = ["ocr", "pdf"] }
rustc-hash = "1.1.0"
twox-hash = "1.6.3"
quadrature = "0.1.2"
# For the FTS feature
jieba-rs = "0.7.0"
aho-corasick = "1.1.3"
rust-stemmers = "1.2.0"
fast2s = "0.3.1"
swapvec = "0.3.0"

[dev-dependencies]
tempfile = "3.14.0"
# Test-only: only `runtime/tests.rs` (cfg(test)) initializes a logger. Moved out
# of [dependencies] so it doesn't bloat downstream builds (upstream cozo #287).
env_logger = "0.11.3"
# CI/stable-runnable perf harness for fork work (the upstream pokec/wiki
# benches use the nightly `#![feature(test)]` bencher + external data — they
# are not registered below, and `autobenches = false` in [package] keeps a
# bare `cargo bench` from tripping over them).
criterion = { version = "0.5", features = ["html_reports"] }
# concurrency_bench: process footprint (proc_pid_rusage)
libc = "0.2"

# kleos fork perf baselines (stable, self-contained synthetic data).
[[test]]
name = "engram"
required-features = ["engram"]

[[test]]
name = "memory_engram"
required-features = ["engram"]

[[example]]
name = "engram_cli"
required-features = ["engram"]

[[example]]
name = "embed_scifact"
required-features = ["infer"]

[[example]]
name = "memory_scenario"
required-features = ["infer"]

[[example]]
name = "concurrency_bench"
required-features = ["infer"]

[[bench]]
name = "point_lookup"
harness = false

[[bench]]
name = "read_path"
harness = false

# temporal-read budget matrix (bitemporality step 6; rewritten from the
# upstream nightly bench)
[[bench]]
name = "time_travel"
harness = false

# cached graph projection: cold vs warm vs write-invalidated (graph-projection
# spec §5). Needs `graph-algo`, which the default feature set carries.
[[bench]]
name = "graph_projection"
harness = false
required-features = ["graph-algo"]
