[package]
name = "kleos-docs"
version = "0.1.0"
edition = "2021"
description = "Documents for kleos: OCR (an Indra OCR port on tract), PDF text layers (pdfium), layout, Markdown and chunking"
license = "MPL-2.0"
repository = "https://github.com/websines/kleos-db"
keywords = ["ocr", "pdf", "chunking", "kleos"]
categories = ["text-processing"]
rust-version = "1.91"

[features]
default = ["ocr", "pdf", "download"]
## The OCR pipeline (det / rec / order / orient / script ONNX graphs on tract).
ocr = ["dep:tract-onnx", "dep:tract-linalg", "dep:image"]
## PDF text layers and rendering through pdfium (dynamic library, loaded at run time).
pdf = ["dep:pdfium-render", "ocr"]
## Fetch model files into the Hugging Face cache on first use.
download = ["dep:hf-hub", "dep:ureq"]

[dependencies]
tract-onnx = { version = "=0.23.8", optional = true }
tract-linalg = { version = "=0.23.8", optional = true, features = ["multithread-mm"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest"], optional = true }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"], optional = true }
ureq = { version = "2", optional = true }
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"
unicode-bidi = "0.3"
unicode-general-category = "1"
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[dev-dependencies]
